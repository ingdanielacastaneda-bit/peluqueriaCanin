# Configuración de Base de Datos
# Este archivo contiene las credenciales y configuración de conexión a MySQL.
# IMPORTANTE: No commitees este archivo con credenciales de producción.
# Para diferentes entornos, crea archivos específicos o usa variables de entorno.

# Nombre de la base de datos
db.name=peluqueria_canina

# URL de conexión (sin especificar la base de datos)
db.url=jdbc:mysql://localhost:3306

# Usuario de MySQL
db.user=root

# Contraseña de MySQL
db.password=1234

# Puerto de MySQL
db.port=3306

# Timezone del servidor
db.timezone=UTC


